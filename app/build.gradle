plugins { id 'com.android.application' }

android {
    namespace 'id.turus.stasiuncuaca'
    compileSdk 36

    defaultConfig {
        applicationId 'id.turus.stasiuncuaca'
        minSdk 26
        targetSdk 36
        versionCode 158
        versionName '1.5.8'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    // USB serial CH340/CH34x used by USB 8-in-1 soil meters.
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
}
